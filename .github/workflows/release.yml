name: Release mod package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mod files
        run: |
          test -f SolarpunkPauseOnMenu/enabled.txt
          test -f SolarpunkPauseOnMenu/scripts/main.lua
          test -f release/README.md

      - name: Build minimal mod zip
        run: |
          mkdir -p dist
          cp -r SolarpunkPauseOnMenu dist/
          cp release/README.md dist/README.md
          cd dist && zip -r ../SolarpunkPauseOnMenu.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: SolarpunkPauseOnMenu.zip
          generate_release_notes: true
          draft: false
          prerelease: false
